<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DisputeKZ — Превью страниц</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .list {
      max-width: 560px;
      margin: 48px auto;
      padding: 0 24px;
    }
    .list h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--zinc-900);
      margin: 0 0 8px;
    }
    .list p.sub {
      color: var(--zinc-500);
      margin: 0 0 32px;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: #fff;
      border: 1px solid var(--zinc-200);
      border-radius: 8px;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
      transition: border-color 150ms, background-color 150ms;
    }
    .item:hover {
      border-color: var(--zinc-300);
      background: #fcfcfd;
    }
    .item__title {
      font-size: 14px;
      font-weight: 600;
      color: var(--zinc-900);
      margin: 0;
    }
    .item__desc {
      font-size: 13px;
      color: var(--zinc-500);
      margin: 2px 0 0;
    }
    .item__arrow {
      color: var(--zinc-400);
    }
  </style>
</head>
<body>
  <div class="list">
    <div style="margin-bottom: 32px;">
      <div class="dk-logo dk-logo--lg" style="margin-bottom: 24px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="12" height="12" transform="rotate(45 10 10)" stroke="currentColor" stroke-width="1.5" fill="none"/>
          <rect x="10" y="10" width="9" height="9" transform="rotate(45 14.5 14.5)" fill="currentColor"/>
        </svg>
        <span class="dk-logo__text">disputekz</span>
      </div>
      <h1>Превью страниц</h1>
      <p class="sub">Статические HTML-превью для визуальной проверки дизайна.<br/>Открой любую страницу в браузере, никаких сборщиков не нужно.</p>
    </div>

    <a class="item" href="register.html">
      <div>
        <p class="item__title">Регистрация</p>
        <p class="item__desc">Заявка на доступ — выбор банка, роль, отделение, приказ</p>
      </div>
      <svg class="item__arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <a class="item" href="login.html">
      <div>
        <p class="item__title">Вход в систему</p>
        <p class="item__desc">Email + пароль, forgot password</p>
      </div>
      <svg class="item__arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>
  </div>
</body>
</html>
