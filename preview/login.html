<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — disputekz</title>
  <link rel="stylesheet" href="_shared.css" />
</head>
<body>
  <div class="dk-auth">
    <!-- Header -->
    <header class="dk-header">
      <div class="dk-header__inner">
        <a href="index.html" class="dk-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="12" height="12" transform="rotate(45 10 10)" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <rect x="10" y="10" width="9" height="9" transform="rotate(45 14.5 14.5)" fill="currentColor"/>
          </svg>
          <span class="dk-logo__text">disputekz</span>
        </a>
        <div class="dk-header__support">
          Служба поддержки:
          <a href="mailto:support@disputekz.kz">support@disputekz.kz</a>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main class="dk-main">
      <div class="dk-main__inner">
        <!-- Heading -->
        <div style="margin-bottom: 32px;">
          <h1 class="dk-h1">Вход в систему</h1>
          <p class="dk-sub">Введите email и пароль, чтобы продолжить работу с диспутами.</p>
        </div>

        <!-- Error banner (hidden by default) -->
        <div class="dk-error-banner" id="errorBanner" style="display:none;"></div>

        <form id="loginForm" class="dk-stack" novalidate>
          <!-- Email -->
          <div class="dk-field">
            <label class="dk-label" for="email">Email</label>
            <input id="email" class="dk-input" name="email" type="email" placeholder="ivanov@bank.kz" autocomplete="email" />
            <p class="dk-error" data-error-for="email" style="display:none;"></p>
          </div>

          <!-- Password -->
          <div class="dk-field">
            <div style="display:flex; align-items:center; justify-content:space-between;">
              <label class="dk-label" for="password">Пароль</label>
              <a href="#" style="font-size:12px; color:var(--zinc-500); text-decoration:underline; text-underline-offset:4px;">Забыли пароль?</a>
            </div>
            <div class="dk-relative">
              <input id="password" class="dk-input dk-pr-10" name="password" type="password" placeholder="Введите пароль" autocomplete="current-password" />
              <button type="button" class="dk-pwd-toggle" aria-label="Показать пароль" data-toggle="password">
                <svg data-icon="eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg data-icon="eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" y1="2" x2="22" y2="22"/>
                </svg>
              </button>
            </div>
            <p class="dk-error" data-error-for="password" style="display:none;"></p>
          </div>

          <!-- Submit -->
          <div style="padding-top: 4px;">
            <button type="submit" class="dk-btn dk-btn--primary dk-btn--lg dk-btn--full" id="submitBtn">
              <span class="dk-btn__label">Войти</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
        </form>

        <!-- Link to register -->
        <div class="dk-divider">
          <p>
            Нет аккаунта?
            <a href="register.html">Отправить заявку на регистрацию</a>
          </p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="dk-footer">
      <div class="dk-footer__inner">
        <span>© 2026 disputekz. Все права защищены.</span>
        <div class="dk-footer__links">
          <a href="#">Условия использования</a>
          <a href="#">Конфиденциальность</a>
        </div>
      </div>
    </footer>
  </div>

  <script>
    // ------------------------------------------------------------
    // Password visibility toggle
    // ------------------------------------------------------------
    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-toggle");
        const input = document.getElementById(targetId);
        const eyeIcon = btn.querySelector('[data-icon="eye"]');
        const eyeOffIcon = btn.querySelector('[data-icon="eye-off"]');
        if (input.type === "password") {
          input.type = "text";
          eyeIcon.style.display = "none";
          eyeOffIcon.style.display = "";
        } else {
          input.type = "password";
          eyeIcon.style.display = "";
          eyeOffIcon.style.display = "none";
        }
      });
    });

    // ------------------------------------------------------------
    // Form validation + submit
    // ------------------------------------------------------------
    function setError(name, msg) {
      const input = document.querySelector(`[name="${name}"]`);
      const err = document.querySelector(`[data-error-for="${name}"]`);
      if (input) input.classList.add("error");
      if (err) {
        err.textContent = msg;
        err.style.display = "";
      }
    }
    function clearError(name) {
      const input = document.querySelector(`[name="${name}"]`);
      const err = document.querySelector(`[data-error-for="${name}"]`);
      if (input) input.classList.remove("error");
      if (err) {
        err.textContent = "";
        err.style.display = "none";
      }
    }
    function clearAll() {
      ["email", "password"].forEach(clearError);
      const banner = document.getElementById("errorBanner");
      banner.style.display = "none";
      banner.textContent = "";
    }

    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");

    form.querySelectorAll("input").forEach((el) => {
      el.addEventListener("input", () => clearError(el.name));
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      clearAll();

      const data = Object.fromEntries(new FormData(form).entries());
      let hasErrors = false;

      if (!data.email?.trim()) { setError("email", "Введите email"); hasErrors = true; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) { setError("email", "Некорректный email"); hasErrors = true; }
      if (!data.password) { setError("password", "Введите пароль"); hasErrors = true; }

      if (hasErrors) return;

      // Simulate submission
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="dk-spinner"></span> Вход...';
      setTimeout(() => {
        alert("Вход выполнен (API пока не подключен)");
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <span class="dk-btn__label">Войти</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
          </svg>`;
      }, 600);
    });
  </script>
</body>
</html>
